# Build branded ShadowTalk installers and attach to GitHub Releases.
# After release, run `npm run desktop:stage` locally (or in deploy) to copy artifacts to public/downloads/.
name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm run desktop:install

      - name: Stage bundled Ollama (optional)
        if: vars.BUNDLE_OLLAMA == '1'
        run: npm run desktop:stage-ollama

      - name: Build web app and Windows installer
        run: npm run desktop:make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload shadowtalk-setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: shadowtalk-setup-windows
          path: electron/dist/shadowtalk-setup.exe
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/shadowtalk-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
