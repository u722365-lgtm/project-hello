name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not configured — skipping edge function deploy."
            echo "Add the secret in GitHub repo settings to enable automatic deploys."
            exit 0
          fi
          supabase functions deploy generate-presentation --project-ref axsudmhjpfzffcicfvuj
          supabase functions deploy chat --project-ref axsudmhjpfzffcicfvuj
          supabase functions deploy document-ai --project-ref axsudmhjpfzffcicfvuj
          supabase functions deploy self-heal --project-ref axsudmhjpfzffcicfvuj
          supabase functions deploy shadow-heal-watchdog --project-ref axsudmhjpfzffcicfvuj
