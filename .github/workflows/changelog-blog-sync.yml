name: Sync changelog to blog

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call changelog-to-blog edge function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$INTERNAL_CRON_SECRET" ]; then
            echo "Skip: set SUPABASE_URL and INTERNAL_CRON_SECRET repo secrets to enable weekly sync."
            exit 0
          fi
          curl -fsS -X POST \
            -H "x-internal-cron-secret: ${INTERNAL_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${SUPABASE_URL%/}/functions/v1/changelog-to-blog" \
            -d '{}' | tee sync-result.json
