[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [ "devtools" ] }
tauri-plugin-log = "2"
open = "5"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
keyring = "3"
base64 = "0.22"
thiserror = "1"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false }
sha2 = "0.10"
getrandom = "0.2"
